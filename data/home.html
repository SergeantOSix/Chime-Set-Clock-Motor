<!DOCTYPE html>
<html>
<head>
    <title>Retro Clock - Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>⏰ RETRO CLOCK ⏰</h1>
        <p class="subtitle">Augmented Retro Clock Motor Driver</p>
        
        <div class="clock-display">
            <div class="time" id="timeDisplay">--:--</div>
            <div class="date" id="dateDisplay">Loading...</div>
            <div class="status disconnected" id="statusDisplay">Disconnected</div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <h3>⬆️ Clock Control</h3>
                <button class="btn btn-fast" onclick="sendCommand('fast')">⏩ Fast Forward</button>
                <button class="btn btn-slow" onclick="sendCommand('slow')">⏩ Slow Forward</button>
                <button class="btn btn-stop" onclick="sendCommand('stop')">⏹ Stop</button>
                <button class="btn btn-reset" onclick="sendCommand('reset')">↺ Reset</button>
            </div>
            
            <div class="control-group">
                <h3>⬇️ Time Settings</h3>
                <button class="btn" onclick="sendCommand('increment')">▲ Increment</button>
                <button class="btn" onclick="sendCommand('decrement')">▼ Decrement</button>
                <button class="btn" onclick="sendCommand('set')">⚙ Set Time</button>
            </div>
        </div>
        
        <div class="info-panel">
            <h3>📊 System Status</h3>
            <div class="info-item">
                <span class="info-label">Connection:</span>
                <span class="info-value" id="connectionStatus">Disconnected</span>
            </div>
            <div class="info-item">
                <span class="info-label">Last Update:</span>
                <span class="info-value" id="lastUpdate">--</span>
            </div>
            <div class="info-item">
                <span class="info-label">Motor Status:</span>
                <span class="info-value" id="motorStatus">Idle</span>
            </div>
        </div>
        
        <div class="navigation">
            <button class="nav-btn" onclick="navigateTo('wifi')">📡 WiFi Settings</button>
        </div>
        
        <div class="footer">
            <p>ESP32 Clock Motor Driver v1.0</p>
        </div>
    </div>
    
    <script>
        let ws;
        let isConnected = false;
        
        function connectWebSocket() {
            ws = new WebSocket("ws://" + window.location.hostname + "/ws");
            
            ws.onopen = function() {
                isConnected = true;
                updateStatus(true);
                console.log("WebSocket Connected");
                sendPageRequest();
            };
            
            ws.onmessage = function(event) {
                try {
                    let data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.log("Error parsing message:", e);
                }
            };
            
            ws.onclose = function() {
                isConnected = false;
                updateStatus(false);
                console.log("WebSocket Disconnected");
            };
            
            ws.onerror = function(error) {
                console.log("WebSocket Error:", error);
            };
        }
        
        function handleMessage(data) {
            if ("time" in data) {
                updateTime(data.time);
            }
            if ("date" in data) {
                updateDate(data.date);
            }
            if ("status" in data) {
                updateMotorStatus(data.status);
            }
            if ("connection" in data) {
                updateConnectionStatus(data.connection);
            }
        }
        
        function updateTime(time) {
            const hours = String(time.getHours()).padStart(2, '0');
            const minutes = String(time.getMinutes()).padStart(2, '0');
            const seconds = String(time.getSeconds()).padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${hours}:${minutes}:${seconds}`;
        }
        
        function updateDate(date) {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            document.getElementById('dateDisplay').textContent = `${days[date.day]} ${date.month} ${date.dayOfMonth}, ${date.year}`;
        }
        
        function updateMotorStatus(status) {
            document.getElementById('motorStatus').textContent = status;
        }
        
        function updateConnectionStatus(connected) {
            const statusEl = document.getElementById('statusDisplay');
            const connStatusEl = document.getElementById('connectionStatus');
            
            if (connected) {
                statusEl.className = 'status connected';
                statusEl.textContent = 'Connected';
                connStatusEl.textContent = 'Connected';
            } else {
                statusEl.className = 'status disconnected';
                statusEl.textContent = 'Disconnected';
                connStatusEl.textContent = 'Disconnected';
            }
        }
        
        function updateStatus(connected) {
            const statusEl = document.getElementById('statusDisplay');
            if (connected) {
                statusEl.className = 'status connected';
                statusEl.textContent = 'Connected';
            } else {
                statusEl.className = 'status disconnected';
                statusEl.textContent = 'Disconnected';
            }
        }
        
        function sendCommand(command) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const message = { command: command };
                ws.send(JSON.stringify(message));
                console.log("Command sent:", command);
            } else {
                alert("Not connected to ESP32. Please check WiFi settings.");
            }
        }
        
        function sendPageRequest() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const message = { page: "home" };
                ws.send(JSON.stringify(message));
            }
        }
        
        function navigateTo(page) {
            window.location.href = '/' + page;
        }
        
        function updateLastUpdate() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent = now.toLocaleTimeString();
        }
        
        window.onload = function() {
            console.log("Window loaded, connecting WebSocket...");
            connectWebSocket();
            
            // Update last update time every minute
            setInterval(updateLastUpdate, 60000);
            
            // Request current time on connection
            setTimeout(sendPageRequest, 1000);
        };
    </script>
</body>
</html>
