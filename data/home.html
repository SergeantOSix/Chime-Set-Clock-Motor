<!DOCTYPE html>
<html>
<head>
    <title>Retro Clock - Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>⏰ RETRO CLOCK ⏰</h1>
        <p class="subtitle">Augmented Retro Clock Motor Driver</p>
        
        <div class="clock-display">
            <div class="time" id="timeClock">--:--</div>
            <div class="time face-clock" id="faceClock">--:--</div>
            <div class="date" id="dateDisplay">Loading...</div>
            <div class="status disconnected" id="statusDisplay">Disconnected</div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <h3>⬆️ Clock Control</h3>
                <button class="btn btn-fast" onclick="sendCommand('fast')">⏩ Fast Forward</button>
                <button class="btn btn-slow" onclick="sendCommand('slow')">⏩ Slow Forward</button>
                <button class="btn btn-stop" onclick="sendCommand('stop')">⏹ Stop</button>
                <button class="btn btn-reset" onclick="sendCommand('reset')">↺ Reset</button>
                <button class="btn" onclick="openSetClockFaceDialog()">⚙ Set Clock Face</button>
            </div>
            
            <div class="control-group">
                <h3>⬇️ Time Settings</h3>
                <button class="btn" onclick="sendCommand('increment')">▲ Increment</button>
                <button class="btn" onclick="sendCommand('decrement')">▼ Decrement</button>
                <button class="btn" onclick="openSetTimeDialog()">⚙ Set Time</button>
            </div>
            
            <div class="control-group">
                <h3>🌍 Timezone & Mode</h3>
                <div class="form-group">
                    <label for="timezoneSelect">Timezone:</label>
                    <select id="timezoneSelect" onchange="updateTimezone()">
                        <option value="UTC0" selected>UTC</option>
                        <option value="UTC-12">UTC-12</option>
                        <option value="UTC-11">UTC-11</option>
                        <option value="UTC-10">UTC-10</option>
                        <option value="UTC-9">UTC-9</option>
                        <option value="UTC-8">UTC-8 (Pacific)</option>
                        <option value="UTC-7">UTC-7 (Mountain)</option>
                        <option value="UTC-6">UTC-6 (Central)</option>
                        <option value="UTC-5">UTC-5 (Eastern)</option>
                        <option value="UTC-4">UTC-4</option>
                        <option value="UTC-3">UTC-3</option>
                        <option value="UTC-2">UTC-2</option>
                        <option value="UTC-1">UTC-1</option>
                        <option value="UTC+1">UTC+1</option>
                        <option value="UTC+2">UTC+2</option>
                        <option value="UTC+3">UTC+3</option>
                        <option value="UTC+4">UTC+4</option>
                        <option value="UTC+5">UTC+5</option>
                        <option value="UTC+6">UTC+6</option>
                        <option value="UTC+7">UTC+7</option>
                        <option value="UTC+8">UTC+8 (China/Japan)</option>
                        <option value="UTC+9">UTC+9</option>
                        <option value="UTC+10">UTC+10</option>
                        <option value="UTC+11">UTC+11</option>
                        <option value="UTC+12">UTC+12</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Time Mode:</label>
                    <div class="toggle-switch">
                        <input type="checkbox" id="autoTimeMode" onchange="updateTimeMode()">
                        <label for="autoTimeMode">Automatic</label>
                    </div>
                </div>
            </div>
            
            <!-- Set Time Dialog -->
            <div id="setTimeDialog" class="dialog" style="display: none;">
                <div class="dialog-content">
                    <h3>⚙ Set Time</h3>
                    <div class="form-group">
                        <label for="setHours">Hours:</label>
                        <input type="number" id="setHours" min="1" max="12" value="0">
                    </div>
                    <div class="form-group">
                        <label for="setMinutes">Minutes:</label>
                        <input type="number" id="setMinutes" min="0" max="59" value="0">
                    </div>
                    <div class="form-group">
                        <label for="setSeconds">Seconds:</label>
                        <input type="number" id="setSeconds" min="0" max="59" value="0">
                    </div>
                    <div class="form-group">
                        <label for="setMilliseconds">Milliseconds:</label>
                        <input type="number" id="setMilliseconds" min="0" max="999" value="0">
                    </div>
                    <div class="form-group">
                        <label for="setMicroseconds">Microseconds:</label>
                        <input type="number" id="setMicroseconds" min="0" max="999" value="0">
                    </div>
                    <div class="dialog-buttons">
                        <button class="btn btn-primary" onclick="confirmSetTime()">Set Time</button>
                        <button class="btn" onclick="closeSetTimeDialog()">Cancel</button>
                    </div>
                </div>
            </div>
            
            <!-- Set Clock Face Dialog -->
            <div id="setClockFaceDialog" class="dialog" style="display: none;">
                <div class="dialog-content">
                    <h3>⚙ Set Clock Face</h3>
                    <div class="form-group">
                        <label for="faceHours">Hours:</label>
                        <input type="number" id="faceHours" min="1" max="12" value="0">
                    </div>
                    <div class="form-group">
                        <label for="faceMinutes">Minutes:</label>
                        <input type="number" id="faceMinutes" min="0" max="59" value="0">
                    </div>
                    <div class="form-group">
                        <label for="faceSeconds">Seconds:</label>
                        <input type="number" id="faceSeconds" min="0" max="59" value="0">
                    </div>
                    <div class="form-group">
                        <label for="faceMilliseconds">Milliseconds:</label>
                        <input type="number" id="faceMilliseconds" min="0" max="999" value="0">
                    </div>
                    <div class="form-group">
                        <label for="faceMicroseconds">Microseconds:</label>
                        <input type="number" id="faceMicroseconds" min="0" max="999" value="0">
                    </div>
                    <div class="dialog-buttons">
                        <button class="btn btn-primary" onclick="confirmSetClockFace()">Set Clock Face</button>
                        <button class="btn" onclick="closeSetClockFaceDialog()">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="info-panel">
            <h3>📊 System Status</h3>
            <div class="info-item">
                <span class="info-label">Connection:</span>
                <span class="info-value" id="connectionStatus">Disconnected</span>
            </div>
            <div class="info-item">
                <span class="info-label">Last Update:</span>
                <span class="info-value" id="lastUpdate">--</span>
            </div>
            <div class="info-item">
                <span class="info-label">Motor Status:</span>
                <span class="info-value" id="motorStatus">Idle</span>
            </div>
        </div>
        
        <div class="navigation">
            <button class="nav-btn" onclick="navigateTo('wifi')">📡 WiFi Settings</button>
        </div>
        
        <div class="footer">
            <p>ESP32 Clock Motor Driver v1.0</p>
        </div>
    </div>
    
    <script src="common.js"></script>
</body>
</html>
